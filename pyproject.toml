[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { include = ["core", "core.*", "utils", "utils.*", "server", "server.*"] }

#  `poe server` | `poe test` | `poe help-tts` | ...
[tool.poe.tasks]
install-all = "pip install -e .[server,test,coqui,windows]"
server = "python start_server.py"
test = "pytest server/tests"
tts = "python tts_reader.py"
translate = "python ai_translator.py"
help-tts = "python tts_reader.py --help"
help-translate = "python ai_translator.py --help"

[project]
name = "modular-tts-engine"
version = "0.1.0"
description = "Modular TTS engine supporting offline (pyttsx3, Coqui) and online (gTTS, Google Cloud) services."
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alfons Zelicko", email = "zelicko.alfons@gmail.com" }
]

# 1. CORE DEPENDENCIES
dependencies = [
    "python-dotenv~=1.2.1",
    "tqdm~=4.67.1",
    "pyttsx3~=2.99",
    "gTTS~=2.5.4",
    "pydub~=0.25.1",
    "simpleaudio~=1.0.4",
    "google-cloud-texttospeech",
    "cachetools~=6.2.2",
    "certifi~=2024.7.4",
    "charset-normalizer~=3.4.4",
    "click~=8.1.8",
    "grpcio~=1.76.0",
    "grpcio-status~=1.76.0",
    "idna~=3.11",
    "proto-plus~=1.26.1",
    #"protobuf~=6.33.1",
    "protobuf>=5.29.6",
    "pyasn1~=0.6.1",
    "pyasn1-modules~=0.4.2",
    "requests~=2.32.5",
    "urllib3~=2.5.0",
    "colorama~=0.4.6",
    "rsa~=4.9.1",
    "openai>=1.0.0",
    "google-genai>=0.3.0",
    "deepl~=1.16.0",
    "poethepoet~=0.31.0",
]

# 2. OPTIONAL DEPENDENCIES (EXTRAS)
[project.optional-dependencies]

# Server-only dependencies (GraphQL API) -> `pip install ".[server,test]"`
server = [
    "strawberry-graphql[fastapi]~=0.243.0",
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "python-multipart~=0.0.12",
]

# Testing dependencies
test = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "hypothesis~=6.122.0",
    "httpx~=0.28.0",
]

# Coqui XTTS Engine (CUDA + TTS)
coqui = [
    "numpy~=1.26.4",
    "coqui-tts>=0.27.2",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]

# Windows-specific dependencies
windows = [
    "pywin32>=311",
    "comtypes~=1.4.13",
    "typing-extensions~=4.15.0",
]
